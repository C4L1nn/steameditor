name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"
  PYINSTALLER_VERSION: "6.1.0"

jobs:
  # ─── Lint & Type Check ───
  lint:
    name: Lint & Type Check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff (lint)
        run: ruff check src/ tests/

      - name: Run Ruff (format check)
        run: ruff format --check src/ tests/

      - name: Run Pyright (type check)
        run: pyright src/steameditor/core src/steameditor/services src/steameditor/events.py src/steameditor/exceptions.py

  # ─── Tests ───
  test:
    name: Run Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Install Playwright
        run: python -m playwright install chromium

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=src/steameditor --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  # ─── Build Executable ───
  build:
    name: Build Executable
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
          pip install -e .

      - name: Install Playwright
        run: python -m playwright install chromium

      - name: Build with PyInstaller
        run: python packaging/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitForge-Executable
          path: dist/SplitForge.exe
          retention-days: 7

  # ─── Build Installer ───
  installer:
    name: Build NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: SplitForge-Executable
          path: dist

      - name: Build NSIS Installer
        run: |
          # Install NSIS
          choco install nsis -y
          # Build installer
          makensis /DVERSION=${{ github.event.release.tag_name }} packaging/nsis/installer.nsi

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SplitForge-Installer
          path: dist/SplitForge_Setup_*.exe
          retention-days: 7

      - name: Release Assets
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'release'
        with:
          files: dist/SplitForge_Setup_*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Publish to Chocolatey (Optional) ───
  chocolatey:
    name: Publish to Chocolatey
    runs-on: windows-latest
    needs: installer
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: SplitForge-Installer
          path: dist

      - name: Create Chocolatey package
        run: |
          # This would create a .nuspec and pack it
          # Requires chocolatey license for push
          echo "Chocolatey publishing not configured yet"

  # ─── Notify ───
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, build, installer]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Could integrate with Slack, Discord, email here

# ─── Branch Protection ───
# This workflow enforces:
# - All PRs must pass lint, test, build
# - Releases must pass all checks before installer is built
# - Coverage must be >= 80%